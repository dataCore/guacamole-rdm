# guacamole-rdm: static SPA. Runs as uid 101 with a read-only root fs; every
# writable path points into /tmp (tmpfs).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    # Same-origin only. Guacamole (API, tunnels, guacamole-common-js) is on
    # this origin under another path; ws(s) to 'self' is covered by
    # connect-src 'self'. img/media blob: are the remote display and audio.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Locations add their Cache-Control on top of the headers above instead
    # of replacing them (nginx >= 1.29.3), so the CSP is stated once.
    location = /config.json {
      alias /tmp/rdm/config.json;
      add_header_inherit merge;
      add_header Cache-Control "no-store" always;
    }

    # Hashed build output: cache forever.
    location /assets/ {
      add_header_inherit merge;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html, theme.css, logos: always revalidate, so a new release or a
    # swapped theme shows up on the next load. No fallback to index.html for
    # unknown paths: the app has no router and loads everything relative to
    # the page, so /anything/ would only produce a broken page.
    location / {
      add_header_inherit merge;
      add_header Cache-Control "no-cache" always;
      index index.html;
      try_files $uri $uri/ =404;
    }
  }
}
